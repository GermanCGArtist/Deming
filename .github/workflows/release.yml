name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_name: deming.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_name: deming
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_name: deming
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            bin_name: deming

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin deming

      - name: Package release archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_DIR="deming-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_DIR}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${PKG_DIR}/"
          cp README.md LICENSE "dist/${PKG_DIR}/"
          (cd dist && tar -czf "${PKG_DIR}.tar.gz" "${PKG_DIR}")
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${PKG_DIR}.tar.gz" > "${PKG_DIR}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${PKG_DIR}.tar.gz" > "${PKG_DIR}.tar.gz.sha256")
          fi
          rm -rf "dist/${PKG_DIR}"

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $pkgDir = "deming-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkgDir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/$pkgDir/"
          Copy-Item "README.md", "LICENSE" "dist/$pkgDir/"
          Compress-Archive -Path "dist/$pkgDir/*" -DestinationPath "dist/$pkgDir.zip" -Force
          $hash = (Get-FileHash "dist/$pkgDir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgDir.zip" | Out-File -Encoding ascii "dist/$pkgDir.zip.sha256"
          Remove-Item -Recurse -Force "dist/$pkgDir"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
