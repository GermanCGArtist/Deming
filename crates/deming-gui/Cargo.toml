[package]
name = "deming-gui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native dark obsidian desktop UI for the Deming Minecraft mod test orchestrator."

[dependencies]
deming-core = { path = "../deming-core" }
deming-fetch = { path = "../deming-fetch" }
deming-auth = { path = "../deming-auth" }
deming-runner = { path = "../deming-runner" }
deming-archive = { path = "../deming-archive" }
deming-ipc = { path = "../deming-ipc" }

eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
rfd = "0.15"
dirs = "6"
zip = "2"

