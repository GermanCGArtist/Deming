[package]
name = "deming-fetch"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minecraft artifact, mod loader, Java runtime, and Modrinth mod fetcher for Deming."

[dependencies]
deming-core = { path = "../deming-core" }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
zip = "2"

