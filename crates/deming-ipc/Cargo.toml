[package]
name = "deming-ipc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Localhost IPC bridge for Deming runners and GUI."

[dependencies]
deming-core = { path = "../deming-core" }
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

