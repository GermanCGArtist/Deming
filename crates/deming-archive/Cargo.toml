[package]
name = "deming-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
deming-core = { path = "../deming-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"
walkdir = "2"
regex = "1"
thiserror = "2"

